<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Интервью чат</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chat-container { max-width: 600px; margin: auto; border: 1px solid #ccc; padding: 10px; border-radius: 10px; }
        .messages { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; }
        .message { padding: 8px 12px; border-radius: 12px; max-width: 80%; word-wrap: break-word; }
        .question { background-color: #f0f0f0; align-self: flex-start; }
        .answer { background-color: #d0f0d0; align-self: flex-end; }
        textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; margin-top: 10px; }
        button { margin-top: 5px; padding: 6px 12px; border-radius: 6px; border: none; background-color: #4CAF50; color: white; cursor: pointer; }
        button:hover { background-color: #45a049; }
        h2 { text-align: center; }
    </style>
</head>
<body>
<div class="chat-container">
    <h2>Интервью: {{ interview.candidate.full_name }}</h2>

    <div class="messages">
        {% for q in interview.questions.all %}
            <div class="message question">{{ q.question_text }}</div>
            {% if q.answer %}
                <div class="message answer">{{ q.answer.answer_text }}</div>
            {% endif %}
        {% endfor %}
    </div>

    {% if current_question %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="question_id" value="{{ current_question.id }}">
            <textarea name="answer_text" rows="3" placeholder="Ваш ответ..." required></textarea><br>
            <button type="submit">Отправить</button>
        </form>
    {% else %}
        <p style="text-align: center; font-weight: bold;">Интервью завершено! Спасибо за ответы.</p>
    {% endif %}
</div>

<script>
    // Прокрутка истории сообщений вниз при загрузке страницы
    const messagesDiv = document.querySelector('.messages');
    if (messagesDiv) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
