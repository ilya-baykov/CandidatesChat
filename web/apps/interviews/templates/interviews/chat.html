<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интервью чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .chat-container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding-bottom: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .system {
            background-color: #fff3cd;
            color: #856404;
            align-self: center;
            font-style: italic;
        }
        .candidate {
            background-color: #d0f0d0;
            align-self: flex-end;
        }
        .agent {
            background-color: #f0d0d0;
            align-self: flex-start;
        }
        form {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: vertical;
            min-height: 80px;
        }
        button {
            padding: 10px;
            border-radius: 8px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Интервью: {{ interview.candidate.full_name }}</h2>

    <div class="messages">
        {% for msg in messages %}
            <div class="message {{ msg.role.code }}">
                {{ msg.content }}
            </div>
        {% endfor %}
    </div>

    {% if current_question %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="question_id" value="{{ current_question.id }}">
            <textarea name="answer_text" required placeholder="Введите ваш ответ..."></textarea>
            <button type="submit">Отправить</button>
        </form>
    {% else %}
        <p style="text-align:center; font-weight:bold;">Интервью завершено!</p>
    {% endif %}
</div>

<script>
    // Автопрокрутка истории сообщений вниз
    const messagesDiv = document.querySelector('.messages');
    if (messagesDiv) {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
