services:


  redis:
    image: redis:7-alpine
    container_name: chat_redis
    ports:
      - "6379:6379"        # хост:контейнер
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5


  worker:
    build: .
    container_name: chat_worker
    depends_on:
      - redis
    env_file:
      - .env.local
    environment:
      REDIS_URL: "redis://redis:6379/0"
      PYTHONPATH: /app/web
    command: celery -A web.config worker -l info




volumes:
  redisdata:


