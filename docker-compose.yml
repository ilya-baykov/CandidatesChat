services:
  web:
    build: .
    image: chat_web
    container_name: chat_web
    ports:
      - "8000:82"          # хост:контейнер
    depends_on:
      db:
        condition: service_healthy
    env_file:
        - .env
    entrypoint: ["/app/entrypoint.sh"]
    command: python /app/web/manage.py runserver 0.0.0.0:82

  db:
    image: postgres:15
    container_name: chat_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10          # больше попыток — надёжнее при первом запуске
      start_period: 10s    # даёт postgres 10 секунд "на разогрев" до начала проверок

volumes:
  pgdata:
